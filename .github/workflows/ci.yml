name: CI

# Builds lmtorch on Linux arm64 and amd64 and runs ./test.sh:
#   release  static CPU-only libtorch from source (cached by lock, build script, runner image and arch), static libstdc++ and
#            libgcc, glibc shared; Ubuntu 22.04 runners set the glibc floor to 2.35
#   dev      against the PyTorch wheel's shared libtorch (fast)
# On a v* tag, the release job also publishes the stripped binaries and license texts as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LMCPP_REF: f6c6f51797912a369d6b27cf9e96f148a9a0e4d1
  LMCTL_VERSION: 0.2.347   # lmscript with DSL bytecode v5 (>= 0.2.346 required)

jobs:
  build-and-test:
    name: ${{ matrix.mode }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04-arm, arch: arm64, mode: release }
          - { runner: ubuntu-22.04, arch: x64, mode: release }
          - { runner: ubuntu-22.04-arm, arch: arm64, mode: dev }
          - { runner: ubuntu-22.04, arch: x64, mode: dev }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: lmtorch
      - name: Checkout pinned lmcpp
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lmctl-ai/lmcpp
          ref: ${{ env.LMCPP_REF }}
          path: lmcpp
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af   # v4.1.0
        with:
          node-version: '24.15'
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev python3-venv file binutils
          # PyTorch 2.9 needs CMake >= 3.27; Ubuntu 22.04 ships 3.22.
          python3 -m pip install --user --quiet 'cmake==3.31.6' 'ninja==1.11.1.4' pyyaml typing_extensions
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@lmctl-ai/lmctl@${LMCTL_VERSION}"
      - name: Secrets scan
        run: python3 lmtorch/scripts/no-secrets.py
      - name: Oracle venv (torch 2.9.1+cpu wheel; tests only, never shipped)
        run: |
          python3 -m venv ~/.cache/lmtorch/oracle-venv
          ~/.cache/lmtorch/oracle-venv/bin/pip install --quiet torch==2.9.1+cpu safetensors numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Restore static libtorch
        if: matrix.mode == 'release'
        id: libtorch
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ~/.cache/lmtorch/libtorch-static
          key: libtorch-${{ matrix.runner }}-${{ hashFiles('lmtorch/libtorch.lock', 'lmtorch/scripts/build-libtorch.sh') }}
      - name: Build static libtorch (cold cache only)
        if: matrix.mode == 'release' && steps.libtorch.outputs.cache-hit != 'true'
        run: LIBTORCH_JOBS=4 lmtorch/scripts/build-libtorch.sh
      - name: Build lmtorch
        env:
          LMCPP_DIR: ${{ github.workspace }}/lmcpp
        run: |
          if [ "${{ matrix.mode }}" = dev ]; then lmtorch/scripts/build-native.sh --dev; else lmtorch/scripts/build-native.sh; fi
      - name: Test
        run: |
          if [ "${{ matrix.mode }}" = release ]; then export LMTORCH_REQUIRE_RELEASE=1 LMTORCH_BIN="$PWD/lmtorch/build/bin/lmtorch"; else export LMTORCH_BIN="$PWD/lmtorch/build-dev/bin/lmtorch"; fi
          lmtorch/test.sh
      - name: Package
        if: matrix.mode == 'release'
        run: lmtorch/scripts/package-release.sh lmtorch/build/bin/lmtorch "linux-${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: matrix.mode == 'release'
        with:
          name: lmtorch-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create the release and attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
